<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RDx Tótems{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['"Source Serif 4"', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            rdx: {
              accent: '#2dd4bf',
              accentDim: '#0f766e',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-grain {
      background-image: radial-gradient(ellipse at top, rgba(45, 212, 191, 0.06), transparent 60%);
    }
    .pulse-dot { animation: pulse-dot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen bg-grain antialiased">
  <header class="border-b border-zinc-900 sticky top-0 z-10 bg-zinc-950/85 backdrop-blur">
    <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 group">
        <div class="w-8 h-8 rounded bg-rdx-accent flex items-center justify-center transition group-hover:rotate-3">
          <span class="text-zinc-950 font-mono font-bold text-sm">R</span>
        </div>
        <div>
          <div class="font-serif text-lg leading-none">RDx · Tótems</div>
          <div class="text-[10px] uppercase tracking-[0.2em] text-zinc-500 mt-1">monitoreo</div>
        </div>
      </a>
      <div class="hidden md:flex items-center gap-3 text-xs text-zinc-500">
        {% if ngrok_url %}
        <span class="text-zinc-600">público</span>
        <a href="{{ ngrok_url }}" class="font-mono text-zinc-400 hover:text-rdx-accent truncate max-w-[320px]">{{ ngrok_url }}</a>
        {% endif %}
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-zinc-900 mt-20">
    <div class="max-w-7xl mx-auto px-6 py-6 flex items-center justify-between text-xs text-zinc-500">
      <span class="font-mono">rdx-totem-mvp · v0.1.0</span>
      <span class="font-serif italic text-zinc-600">byRiolab</span>
    </div>
  </footer>
</body>
</html>
