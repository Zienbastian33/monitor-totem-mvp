<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>{% block title %}RDx Tótems{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Raleway', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
          },
          colors: {
            rdxNavy: '#0B2D5C',
            rdxOff: '#faf8f6',
          },
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Raleway', sans-serif; }
  </style>
</head>
<body class="bg-white text-gray-700 min-h-screen antialiased">
  <header class="h-14 sticky top-0 z-40 backdrop-blur-md bg-[rgba(250,248,246,0.78)] border-b border-gray-200">
    <div class="max-w-7xl mx-auto h-full px-4 sm:px-6 lg:px-8 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3 select-none">
        <img src="/static/images/logo_rdx_1.png" alt="RDx" class="h-6 w-auto">
        <span class="text-xl font-medium text-gray-900">RDx · Tótems</span>
      </a>
      {% if ngrok_url %}
      <div class="hidden md:flex items-center gap-3">
        <span class="font-mono text-[11px] uppercase tracking-[0.18em] text-gray-400">— público —</span>
        <a href="{{ ngrok_url }}" class="text-sm text-gray-500 hover:text-gray-900 transition-colors truncate max-w-[320px]">{{ ngrok_url }}</a>
      </div>
      {% endif %}
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-gray-200 mt-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-3 items-center text-xs text-gray-400">
      <span class="font-mono">rdx-totem-mvp · v0.2.0</span>
      <div class="flex justify-center">
        <img src="/static/images/byRiolab.png" alt="byRiolab" class="h-7 opacity-30 hover:opacity-60 transition-opacity">
      </div>
      <span></span>
    </div>
  </footer>
</body>
</html>
